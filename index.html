<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
<meta name="theme-color" content="#EDE6D3">
<title>Office</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFFFFF;
    --paper-row: #F6F6F6;
    --paper-row-alt: #F0F0F0;
    --ink: #24211B;
    --ink-soft: #6b6350;
    --rule: #b8ad8c;
    --seal: #8C2F1B;
    --seal-dark: #6f2415;
    --green: #3E6B57;
    --gold: #a9822f;
    --shadow: 0 2px 8px rgba(36,33,27,0.15);
    --kb-height: 0px;

    --fs-item: 15px;
    --fs-price: 17px;
    --fs-qty: 11px;
    --fs-cotag: 10px;
    --fs-label: 11px;
    --fs-search: 16px;
    --fs-chip: 12px;
    --fs-field-label: 11px;
    --fs-field-input: 15px;
  }
  body.font-large{
    --fs-item: 19px;
    --fs-price: 22px;
    --fs-qty: 16px;
    --fs-cotag: 13px;
    --fs-label: 14px;
    --fs-search: 18px;
    --fs-chip: 14px;
    --fs-field-label: 13px;
    --fs-field-input: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%; overscroll-behavior-y: contain; overflow-x:hidden; max-width:100vw;}
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 35px, rgba(184,173,140,0.18) 36px);
    font-family:'IBM Plex Sans','Noto Sans Gujarati',sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background: var(--paper);
    border-bottom: 3px double var(--rule);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  }
  .brand-row{
    display:flex; align-items:center; justify-content:flex-start; gap:14px;
    margin-bottom:12px;
  }
  .brand{
    display:flex; flex-direction:column; align-items:flex-start; gap:5px;
  }
  .brand h1{
    font-family:'Special Elite',monospace;
    font-size: 22px;
    margin:0;
    letter-spacing: 0.5px;
    color: var(--ink);
  }
  .brand small{
    font-family:'Noto Sans Gujarati',sans-serif;
    font-size:11px;
    color: var(--ink-soft);
  }
  .count-stamp{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12px;
    border: 2px solid var(--seal);
    color: var(--seal);
    border-radius: 999px;
    padding: 4px 11px;
    transform: rotate(-4deg);
    white-space:nowrap;
    background: rgba(140,47,27,0.05);
    align-self:flex-start;
  }
  .header-actions{
    display:flex; align-items:center; gap:6px;
  }
  .stack-btns{
    display:flex; flex-direction:column; gap:4px;
  }
  .icon-btn{
    width:34px; height:34px;
    border-radius:8px;
    border: 1.5px solid var(--rule);
    background: #FBF8EF;
    color: var(--ink);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn.small{
    width:34px; height:17px;
    border-radius:5px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .icon-btn.wide{
    width:auto; height:17px;
    padding:0 6px;
    border-radius:5px;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .icon-btn:active{ background: rgba(140,47,27,0.1); }
  .icon-btn.active-select{ background: var(--seal); color: var(--paper); border-color: var(--seal); }

  .row-check{
    width:20px; height:20px; flex-shrink:0; accent-color: var(--seal);
  }
  .check-row{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:8px 2px; border-bottom:1px dashed var(--rule);
  }
  .check-row input.row-check{ width:20px !important; flex:0 0 auto; }
  .check-row span{ flex:1; font-size:15px; }

  .select-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:#FBF8EF; border-top:2px solid var(--rule);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px;
    box-shadow: 0 -2px 8px rgba(36,33,27,0.15);
  }
  .select-bar span{
    flex:1; font-family:'IBM Plex Mono',monospace; font-size:13px; color: var(--ink-soft);
  }
  .select-bar .btn{ flex:0 0 auto; padding:9px 16px; font-size:13px; }

  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    font-family:'IBM Plex Sans',sans-serif;
    font-size: var(--fs-search);
    padding: 14px 42px 14px 14px;
    border-radius: 10px;
    border: 2px solid var(--ink);
    background: #FBF8EF;
    color: var(--ink);
    outline:none;
  }
  .search-wrap input:focus{
    border-color: var(--seal);
    box-shadow: 0 0 0 3px rgba(140,47,27,0.15);
  }
  .search-wrap .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--ink-soft);
    font-size:20px; line-height:1; padding:6px; cursor:pointer;
    display:none;
  }
  .search-wrap .clear-btn.show{ display:block; }

  .chips{
    display:flex; gap:8px; overflow-x:auto; margin-top:10px;
    padding-bottom:4px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size: var(--fs-chip); font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    border:1.5px solid var(--rule);
    color: var(--ink-soft);
    background: var(--paper-row-alt);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  /* ---------- List ---------- */
  main{
    flex:1;
    padding: 8px 12px 100px;
    max-width: 720px;
    width:100%;
    margin: 0 auto;
  }
  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .stamp-icon{
    font-family:'Special Elite',monospace;
    font-size:15px;
    border:2px dashed var(--rule);
    display:inline-block;
    padding:16px 24px;
    border-radius:8px;
    transform: rotate(-2deg);
  }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 14px 8px;
    border-bottom: 1px dashed var(--rule);
    cursor:pointer;
    transition: background .12s;
  }
  .row:active{ background: rgba(140,47,27,0.08); }
  .row .sr{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color: var(--ink-soft);
    width:28px;
    flex-shrink:0;
    text-align:right;
  }
  .row .main-info{
    flex:1;
    min-width:0;
  }
  .row .item-name{
    font-size: var(--fs-item);
    font-weight:700;
    color: var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .meta-line{
    display:flex; align-items:center; gap:6px;
    margin-top:4px;
  }
  .co-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size: var(--fs-cotag);
    font-weight:600;
    color: var(--green);
    background: rgba(62,107,87,0.12);
    padding:2px 8px;
    border-radius:4px;
    text-transform:uppercase;
  }
  .label-text{
    font-size: var(--fs-label); color: var(--ink-soft);
  }
  .row .nums{
    text-align:right;
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
  }
  .row .price{
    font-size: var(--fs-price); font-weight:700; color: #1a4d8f;
  }
  .row .qty{
    font-size: var(--fs-qty); font-weight:700; color: #a0430c;
  }

  .move-item-name{
    font-size:14px; color: var(--ink-soft); display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .move-co-row{
    padding:13px 10px;
    border-bottom:1px dashed var(--rule);
    font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .move-co-row:active{ background: rgba(140,47,27,0.08); }

  .result-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color: var(--ink-soft);
    text-align:center;
    padding: 14px 0 4px;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:20px; bottom: calc(24px + env(safe-area-inset-bottom)); z-index:40;
    width:60px; height:60px; border-radius:50%;
    background: var(--seal);
    color: var(--paper);
    border: none;
    font-size:28px;
    box-shadow: 0 4px 14px rgba(140,47,27,0.45);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .1s;
  }
  .fab:active{ transform: scale(0.88) rotate(-8deg); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(36,33,27,0.55);
    z-index:50; display:none;
    align-items:flex-end;
    padding-bottom: var(--kb-height);
    transition: padding-bottom .15s ease-out;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: #FBF8EF;
    width:100%;
    max-height: calc(92vh - var(--kb-height));
    overflow-y:auto;
    border-radius: 18px 18px 0 0;
    border-top: 4px solid var(--seal);
    padding: 18px 18px 24px;
    animation: slideUp .22s ease-out;
  }
  #customConfirmOverlay{ align-items:flex-start; justify-content:center; z-index:200; padding:20px; padding-top:18vh; }
  #customConfirmOverlay .sheet{ width:100%; max-width:360px; border-radius:16px; border-top:4px solid #B3261E; margin:0; }
  @keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet h2{
    font-family:'Special Elite',monospace;
    font-size:19px;
    margin: 0 0 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .sheet .close-x{
    background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size: var(--fs-field-label);
    color: var(--ink-soft);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .field input, .field select{
    width:100%;
    padding: 12px 12px;
    font-size: var(--fs-field-input);
    font-family:'IBM Plex Sans',sans-serif;
    border-radius:8px;
    border: 1.5px solid var(--rule);
    background: #fff;
    color: var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus{
    border-color: var(--seal);
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .sheet-actions{
    display:flex; gap:10px; margin-top:8px;
  }
  .btn{
    flex:1;
    padding: 13px;
    border-radius:9px;
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .btn-save{ background: var(--seal); color: var(--paper); }
  .btn-save:active{ background: var(--seal-dark); }
  .btn-delete{ background: transparent; color: var(--seal); border:1.5px solid var(--seal); flex:0 0 auto; padding:13px 16px; }
  .btn-cancel{ background: transparent; color: var(--ink-soft); border:1.5px solid var(--rule); flex:0 0 auto; padding:13px 16px; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding: 10px 18px;
    border-radius:8px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition: all .25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Order Sheet ---------- */
  .order-add-row{ margin-bottom:12px; }
  .order-pick-btn{
    width:100%;
    padding: 14px;
    border-radius:10px;
    border: 2px dashed var(--rule);
    background: #FBF8EF;
    color: var(--ink-soft);
    font-size:15px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .order-pick-btn:active{ background: rgba(140,47,27,0.08); }
  .order-pending{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background: var(--paper-row-alt);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  .pending-info{ flex:1 1 100%; min-width:0; display:flex; gap:8px; }
  .pending-name-input{
    flex:1; min-width:0;
    font-weight:600; font-size:14px;
    padding:9px 8px;
    border-radius:7px;
    border: 1.5px solid var(--rule);
    background:#fff;
    outline:none;
  }
  .pending-price-input{
    width:74px; flex:0 0 auto;
    font-size:13px; color: var(--ink);
    font-family:'IBM Plex Mono',monospace;
    padding:9px 6px;
    border-radius:7px;
    border: 1.5px solid var(--rule);
    background:#fff;
    outline:none;
    text-align:right;
  }
  .pending-name-input:focus, .pending-price-input:focus{ border-color: var(--seal); }
  .order-qty-input{
    width:64px; flex:0 0 auto;
    padding: 10px 8px;
    font-size:14px;
    border-radius:8px;
    border: 1.5px solid var(--rule);
    background:#fff;
    outline:none;
    text-align:right;
  }
  .order-qty-input:focus{ border-color: var(--seal); }
  .order-sr-row{
    display:flex; gap:8px; margin-bottom:8px;
  }
  .order-sr-row select{
    flex:1; min-width:0;
    padding: 11px 8px;
    font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;
    border-radius:8px;
    border: 1.5px solid var(--rule);
    background:#fff;
    color: var(--ink);
    outline:none;
  }
  .order-sr-row input{
    width:72px; flex:0 0 auto;
    padding: 11px 8px;
    font-size:14px;
    border-radius:8px;
    border: 1.5px solid var(--rule);
    background:#fff;
    outline:none;
    text-align:right;
  }
  .order-sr-row select:focus, .order-sr-row input:focus{ border-color: var(--seal); }
  .order-meta-row{ display:flex; gap:8px; margin-bottom:12px; }
  .order-meta-row .field{ flex:1; margin-bottom:0; }
  .add-row-btn{
    flex:0 0 auto;
    padding: 0 16px; height:38px;
    border-radius:8px;
    border:none;
    background: var(--seal);
    color: var(--paper);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
  }
  .picker-row{ cursor:pointer; }
  .order-rows{ max-height:38vh; overflow-y:auto; margin-bottom:6px; }
  .order-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 4px;
    border-bottom:1px dashed var(--rule);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .order-row .order-sr{ width:20px; color:var(--ink-soft); text-align:right; flex-shrink:0; }
  .order-row .order-name{
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'IBM Plex Sans',sans-serif; font-size:14px;
  }
  .order-row .order-co{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:600;
    color: var(--green);
    background: rgba(62,107,87,0.12);
    padding:1px 6px; border-radius:4px;
    margin-right:6px;
    text-transform:uppercase;
  }
  .order-row .order-qty{ width:42px; text-align:right; flex-shrink:0; }
  .order-row .order-price{ width:60px; text-align:right; flex-shrink:0; }
  .order-row .order-remove{
    background:none; border:none; color:var(--seal);
    font-size:19px; line-height:1; cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .order-total{
    text-align:right; font-weight:700; font-size:13px;
    padding:10px 4px;
    font-family:'IBM Plex Mono',monospace;
    border-top: 2px double var(--rule);
  }
  .btn-whatsapp{ background:#25D366; color:#fff; }
  .btn-whatsapp:active{ background:#1ea955; }

  /* ---------- Printable sheet (off-screen, used for print + image share) ---------- */
  /* Portrait, mobile-screen-proportioned single copy (not A4, not duplicated) */
  .print-area{
    position:absolute; left:-9999px; top:0;
    width:430px;
    background:#fff;
    color:#000;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .sheet-copy{ padding:16px 14px; box-sizing:border-box; width:430px; }
  .sheet-label{
    text-align:center; font-weight:700; font-size:16px;
    text-decoration:underline; letter-spacing:1px;
    margin-bottom:8px;
  }
  .sheet-meta{
    font-size:12px; margin-bottom:10px; line-height:1.5;
  }
  .sheet-copy table{ width:100%; border-collapse:collapse; font-size:11.5px; table-layout:fixed; }
  .sheet-copy th, .sheet-copy td{ border:1px solid #000; padding:4px 4px; text-align:left; overflow:hidden; }
  .sheet-copy th{ background:#eee; }
  .sheet-copy td.c-item, .sheet-copy th.c-item{ white-space:normal; word-break:break-word; }
  .sheet-copy .c-sr{ width:7%; text-align:center; white-space:nowrap; }
  .sheet-copy .c-co{ width:13%; text-align:left; white-space:nowrap; font-weight:700; font-size:10px; text-transform:uppercase; }
  .sheet-copy .c-qty{ width:14%; text-align:right; white-space:nowrap; }
  .sheet-copy .c-price{ width:16%; text-align:right; white-space:nowrap; }
  .sheet-copy .c-total{ width:17%; text-align:right; white-space:nowrap; }
  .sheet-total-row{ margin-top:8px; font-weight:700; font-size:13px; text-align:right; }

  @media print{
    body > *:not(.print-area){ display:none !important; }
    .print-area{ position:static; left:0; width:100%; display:flex; justify-content:center; }
    @page{ size:auto; margin:6mm; }
    .sheet-copy{ page-break-inside:avoid; width:430px; max-width:100%; }
  }

  .analysis-total{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:16px;
    background: rgba(140,47,27,0.08);
    border: 1.5px solid var(--seal);
    color: var(--seal-dark);
    border-radius: 10px;
    padding: 12px 14px;
    text-align:center;
  }
  .analysis-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:12px 6px;
    border-bottom: 1px dashed var(--rule);
  }
  .analysis-row .a-info{
    min-width:0; flex:1 1 auto; overflow:hidden;
  }
  .analysis-row .a-name{
    font-weight:600; font-size:15px; color: var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .analysis-row .a-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color: var(--ink-soft); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .analysis-row .a-value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:15px; color: var(--seal-dark);
    white-space:nowrap; flex:0 0 auto;
  }

  /* ---------- Sheet Edit (Excel-style) ---------- */
  .sheet-tall{
    display:flex;
    flex-direction:column;
    height: calc(98vh - var(--kb-height));
    max-height: calc(98vh - var(--kb-height));
    overflow-y:hidden;
    padding-top:10px;
  }
  .sheet-tall > h2{ flex:0 0 auto; margin-bottom:8px; }
  .sheet-tall > .xl-toolbar{ flex:0 0 auto; }
  .xl-table-wrap{
    overflow-x:auto; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    max-height:58vh;
    border:1.5px solid var(--rule);
    border-radius:8px;
    margin-top:4px;
  }
  .sheet-tall .xl-table-wrap{
    flex:1 1 auto;
    min-height:0;
    max-height:none;
  }
  table.xl-table{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
  }
  table.xl-table thead th{
    position:sticky; top:0; z-index:2;
    background:#EDE6D3;

<script>
const SEED_ITEMS = [];

let ITEMS = [];
let editingIndex = null; // index into ITEMS array, or null = adding new
let activeCompanyFilter = null;
const RENDER_LIMIT = 150;
let selectMode = false;
let selectedIdx = new Set();
let moveItemIdxs = null;

const el = (id) => document.getElementById(id);

/* ---------- Keep bottom-sheets above the on-screen keyboard ---------- */
(function setupKeyboardFix(){
  if(window.visualViewport){
    const vv = window.visualViewport;
    function onViewportChange(){
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb-height', kb + 'px');
    }
    vv.addEventListener('resize', onViewportChange);
    vv.addEventListener('scroll', onViewportChange);
    onViewportChange();
  }
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if(t && t.closest && t.closest('.overlay') && (t.tagName === 'INPUT' || t.tagName === 'SELECT')){
      setTimeout(() => t.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300);
    }
  });
})();

const STORAGE_KEY = 'stockAppItemsV1';

function saveItems(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ITEMS));
  }catch(e){
    showToast('Auto-save ન થયું: ' + ((e && e.message) || e));
  }
}

function loadItems(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length){
        ITEMS = parsed;
        renderChips();
        renderResults();
        return;
      }
    }
  }catch(e){ /* fall through to seed data */ }
  ITEMS = SEED_ITEMS.slice();
  saveItems();
  renderChips();
  renderResults();
}

function resetToDefaultItems(){
  ITEMS = SEED_ITEMS.slice();
  saveItems();
  activeCompanyFilter = null;
  renderChips();
  renderResults();
  showToast('Default data પર reset થયું');
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(ITEMS, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = 'stock-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('Export થયું — file save કરો');
  }catch(e){
    showToast('Export ન થયું: ' + ((e && e.message) || e));
  }
}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('file માં items list નથી');
      ITEMS = data;
      activeCompanyFilter = null;
      saveItems();
      renderChips();
      renderResults();
      showToast('Import થયું — ' + ITEMS.length + ' items');
    }catch(err){
      showToast('Import ન થયું: ' + ((err && err.message) || err));
    }
  };
  reader.onerror = () => showToast('File વાંચવામાં ભૂલ');
  reader.readAsText(file);
}

async function importExcelData(file){
  showToast('Excel વંચાય છે...');
  try{
    await loadXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let updated = 0, skipped = 0;
    wb.SheetNames.forEach(sheetName => {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      rows.forEach(row => {
        const srRaw = row['Sr'];
        if(srRaw === '' || srRaw === undefined || srRaw === null) return;
        const sr = Number(srRaw);
        if(isNaN(sr)) return;
        const companyVal = row['Company'];
        const rowCompany = (companyVal !== '' && companyVal !== undefined && companyVal !== null)
          ? String(companyVal).trim() : '';
        const item = rowCompany
          ? ITEMS.find(i => Number(i.sr) === sr && (i.company || 'MISC') === rowCompany)
          : ITEMS.find(i => Number(i.sr) === sr);
        if(!item){ skipped++; return; }
        const nameVal = row['Item Name'];
        const labelVal = row['Label'];
        const priceVal = row['Price'];
        const qtyVal = row['Qty'];
        if(companyVal !== '' && companyVal !== undefined && companyVal !== null){
          item.company = String(companyVal).trim();
        }
        if(nameVal !== '' && nameVal !== undefined && nameVal !== null){
          item.name = String(nameVal).trim();
        }
        if(labelVal !== undefined && labelVal !== null){
          item.label = String(labelVal).trim();
        }
        if(priceVal !== '' && priceVal !== undefined && !isNaN(Number(priceVal))){
          item.price = Number(priceVal);
        }
        if(qtyVal !== '' && qtyVal !== undefined && !isNaN(Number(qtyVal))){
          item.qty = Number(qtyVal);
        }
        updated++;
      });
    });
    saveItems();
    renderChips();
    renderResults();
    if(updated === 0){
      showToast('કંઈ match ન થયું — Sr column check કરો');
    } else {
      showToast('Excel Import થયું — ' + updated + ' updated' + (skipped ? ', ' + skipped + ' skip' : ''));
    }
  }catch(e){
    showToast('Excel Import ન થયું: ' + ((e && e.message) || e));
  }
}

async function importExcelSync(file){
  showToast('Excel Sync થાય છે...');
  try{
    await loadXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const newItemsByCompany = {};
    const companiesTouched = new Set();

    function normRow(row){
      const out = {};
      Object.keys(row).forEach(k => { out[k.trim().toLowerCase()] = row[k]; });
      return out;
    }
    const skipSheets = ['search','master search','allsearch','alldata','all data'];

    wb.SheetNames.forEach(sheetName => {
      if(skipSheets.includes(sheetName.trim().toLowerCase())) return; // skip instructional/search sheets
      const ws = wb.Sheets[sheetName];
      const rawRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      rawRows.forEach(raw => {
        const row = normRow(raw);
        const companyVal = row['company'];
        const nameVal = row['item name'];
        const labelVal = row['label'];
        const priceVal = row['price'];
        const qtyVal = row['qty'];
        const companyEmpty = (companyVal === '' || companyVal === undefined || companyVal === null);
        const nameEmpty = (nameVal === '' || nameVal === undefined || nameVal === null);
        if(nameEmpty) return; // no item name, skip row
        // If sheet has no Company column, use the sheet name itself as the company (per-company sheet layout)
        const company = companyEmpty ? sheetName.trim() : String(companyVal).trim();
        if(!newItemsByCompany[company]) newItemsByCompany[company] = [];
        newItemsByCompany[company].push({
          sr: newItemsByCompany[company].length + 1,
          company,
          label: (labelVal === undefined || labelVal === null) ? '' : String(labelVal).trim(),
          name: nameEmpty ? '' : String(nameVal).trim(),
          price: (priceVal === '' || priceVal === undefined || isNaN(Number(priceVal))) ? '' : Number(priceVal),
          qty: (qtyVal === '' || qtyVal === undefined || isNaN(Number(qtyVal))) ? '' : Number(qtyVal)
        });
        companiesTouched.add(company);
      });
    });

    const seenCompanies = new Set();
    const rebuilt = [];
    ITEMS.forEach(i => {
      const c = i.company || 'MISC';
      if(companiesTouched.has(c)){
        if(!seenCompanies.has(c)){
          rebuilt.push(...newItemsByCompany[c]);
          seenCompanies.add(c);
        }
      } else {
        rebuilt.push(i);
      }
    });
    companiesTouched.forEach(c => {
      if(!seenCompanies.has(c)){
        rebuilt.push(...newItemsByCompany[c]);
        seenCompanies.add(c);
      }
    });

    ITEMS = rebuilt;
    saveItems();
    renderChips();
    renderResults();
    showToast(companiesTouched.size + ' company sync થઈ');
  }catch(e){
    showToast('Excel Sync ન થયું: ' + ((e && e.message) || e));
  }
}

/* ---------- Order Sheet (printable 19-row estimate slip) ---------- */
let orderRows = [];
let pendingItem = null;
const ORDER_MAX_ROWS = 19;

function openOrderSheet(){
  pendingItem = null;
  el('orderPending').style.display = 'none';
  if(!el('orderDate').value){
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    el('orderDate').value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  renderOrderRows();
  el('orderOverlay').classList.add('show');
}

function showPendingPanel(){
  el('pendingNameInput').value = pendingItem.name || '';
  el('pendingPriceInput').value = (pendingItem.price === '' || pendingItem.price === undefined) ? '' : pendingItem.price;
  const coTag = el('pendingCompanyTag');
  if(pendingItem.company){
    coTag.textContent = pendingItem.company;

function formatDateDMY(isoDate){
  if(!isoDate) return '';
  const parts = isoDate.split('-');
  if(parts.length !== 3) return isoDate;
  return parts[2] + '-' + parts[1] + '-' + parts[0];
}

function loadHtml2Canvas(){

}

function loadXLSX(){
  return new Promise((resolve, reject) => {
    if(window.XLSX) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();

function sanitizeSheetName(name){
  let n = String(name || 'MISC').replace(/[\\\/\?\*\[\]:]/g, ' ').trim();
  if(!n) n = 'MISC';
  return n.slice(0, 31);
}

async function exportItemsToExcel(items, fileNamePrefix, shareTitle){
  if(!items || items.length === 0){ showToast('Items નથી'); return; }
  showToast('Excel બનાવાય છે...');
  try{
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const companies = Array.from(new Set(items.map(i => i.company || 'MISC'))).sort();
    const usedNames = new Set();
    companies.forEach(co => {
      const rows = items.filter(i => (i.company || 'MISC') === co).map(i => ({
        'Sr': i.sr,
        'Company': i.company || 'MISC',
        'Item Name': i.name,
        'Label': i.label || '',
        'Price': i.price === '' ? '' : i.price,
        'Qty': i.qty === '' ? '' : i.qty
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const base = sanitizeSheetName(co);
      let sheetName = base, count = 1;
      while(usedNames.has(sheetName)){ sheetName = base.slice(0, 27) + '_' + (++count); }
      usedNames.add(sheetName);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
    const stamp = new Date().toISOString().slice(0,10);
    const fileName = fileNamePrefix + '-' + stamp + '.xlsx';
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    const file = new File([blob], fileName, { type: 'application/octet-stream' });
    if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: shareTitle || 'Stock Excel' });
        return;
      }catch(shareErr){
        // user cancelled share sheet — fall through to download
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('Excel save થયું');
  }catch(e){
    showToast('Excel export ન થયું: ' + ((e && e.message) || e));
  }
}

function normalize(s){
  return (s===null || s===undefined) ? '' : String(s).toLowerCase();
}

function matchesQuery(item, words){
  const hay = normalize(item.sr) + '|' + normalize(item.company) + '|' + normalize(item.label) + '|' + normalize(item.name) + '|' + normalize(item.price) + '|' + normalize(item.qty);
  for(const w of words){
    if(w && hay.indexOf(w) === -1) return false;
  }
  return true;
}

function getFiltered(){
  const q = normalize(el('searchInput').value).trim();
  const words = q.length ? q.split(/\s+/) : [];
  let list = ITEMS;
  if(activeCompanyFilter){
    list = list.filter(i => i.company === activeCompanyFilter);
  }
  if(words.length){
    list = list.filter(i => matchesQuery(i, words));
  } else if(!activeCompanyFilter){
    list = [];
  }
  return list;
}

function renderChips(){
  const companies = Array.from(new Set(ITEMS.map(i => i.company))).sort();
  const wrap = el('chipsRow');
  wrap.innerHTML = '';
  companies.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCompanyFilter === c ? ' active' : '');
    chip.textContent = c;
    chip.onclick = () => {
      activeCompanyFilter = (activeCompanyFilter === c) ? null : c;
      renderChips();
      renderResults();
    };
    wrap.appendChild(chip);
  });
}

function fmtNum(v){
  if(v === '' || v === null || v === undefined) return '-';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n % 1 === 0 ? String(n) : n.toFixed(2);
}

function renderResults(){
  const filtered = getFiltered();
  const wrap = el('resultsWrap');
  el('countStamp').textContent = ITEMS.length + ' items';

  if(filtered.length === 0){
    const q = el('searchInput').value.trim();
    wrap.innerHTML = '<div class="empty-state"><div class="stamp-icon">' +
      (q || activeCompanyFilter ? 'કંઈ મળ્યું નહીં' : 'શોધવા માટે લખો અથવા company પસંદ કરો') +
      '</div></div>';
    return;
  }

  const shown = filtered.slice(0, RENDER_LIMIT);
  let html = '';
  shown.forEach((item) => {
    const realIndex = ITEMS.indexOf(item);
    const total = (item.price !== '' && item.qty !== '' && !isNaN(item.price) && !isNaN(item.qty))
      ? (Number(item.price) * Number(item.qty)) : '';
    const checkboxHtml = selectMode
      ? `<input type="checkbox" class="row-check" data-idx="${realIndex}" ${selectedIdx.has(realIndex) ? 'checked' : ''}>`
      : '';
    html += `<div class="row" data-idx="${realIndex}">
      ${checkboxHtml}
      <div class="main-info">
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="meta-line">
          <span class="co-tag">${escapeHtml(item.company)}</span>
          ${item.label ? '<span class="label-text">' + escapeHtml(item.label) + '</span>' : ''}
        </div>
      </div>
      <div class="nums">
        <div class="price">₹${fmtNum(item.price)}</div>
        <div class="qty">Qty: ${fmtNum(item.qty)}${total !== '' ? ' · ₹' + fmtNum(total) : ''}</div>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;

  if(filtered.length > RENDER_LIMIT){
    const hint = document.createElement('div');
    hint.className = 'result-hint';
    hint.textContent = `${filtered.length} માંથી top ${RENDER_LIMIT} બતાવ્યા — વધુ specific શબ્દ લખો`;
    wrap.appendChild(hint);
  }

  wrap.querySelectorAll('.row').forEach(rowEl => {
    const idx = parseInt(rowEl.dataset.idx);
    rowEl.addEventListener('click', () => {
      if(selectMode){ toggleSelect(idx); } else { openEditSheet(idx); }
    });
  });
}

function renumberCompany(co){
  let n = 1;
  ITEMS.forEach(i => { if(i.company === co){ i.sr = n++; } });
}

function openMoveSheet(idxOrArr){
  const idxs = Array.isArray(idxOrArr) ? idxOrArr.slice() : [idxOrArr];
  const items = idxs.map(i => ITEMS[i]).filter(Boolean);
  if(items.length === 0) return;
  moveItemIdxs = idxs;
  if(items.length === 1){
    el('moveItemName').innerHTML = `<span class="co-tag">${escapeHtml(items[0].company)}</span> ${escapeHtml(items[0].name)}`;
  } else {
    el('moveItemName').innerHTML = `<b>${items.length} items</b> પસંદ કરેલા`;
  }
  el('moveNewCompany').value = '';
  el('moveSearch').value = '';
  renderMoveCompanyList();
  el('moveOverlay').classList.add('show');
}

function closeMoveSheet(){
  el('moveOverlay').classList.remove('show');
  moveItemIdxs = null;
}

function renderMoveCompanyList(){
  if(!moveItemIdxs || moveItemIdxs.length === 0) return;
  const items = moveItemIdxs.map(i => ITEMS[i]).filter(Boolean);
  if(items.length === 0) return;
  const currentCompanies = new Set(items.map(i => i.company));
  const q = normalize(el('moveSearch').value).trim();
  let companies = Array.from(new Set(ITEMS.map(i => i.company))).filter(c => !currentCompanies.has(c) || currentCompanies.size > 1).sort();
  if(q) companies = companies.filter(c => normalize(c).indexOf(q) !== -1);
  const wrap = el('moveCompanyList');
  if(companies.length === 0){
    wrap.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="stamp-icon">Company ન મળી</div></div>';
    return;
  }
  wrap.innerHTML = companies.map(c => `<div class="move-co-row" data-co="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('');
  wrap.querySelectorAll('.move-co-row').forEach(r => {
    r.addEventListener('click', () => moveItemToCompany(r.dataset.co));
  });
}

function moveItemToCompany(newCompany){
  newCompany = (newCompany || '').trim();
  if(!newCompany || !moveItemIdxs || moveItemIdxs.length === 0) return;
  const items = moveItemIdxs.map(i => ITEMS[i]).filter(Boolean);
  if(items.length === 0) return;
  const touchedCompanies = new Set();
  let movedCount = 0;
  items.forEach(item => {
    if(item.company === newCompany) return;
    touchedCompanies.add(item.company);
    item.company = newCompany;
    movedCount++;
  });
  touchedCompanies.add(newCompany);
  touchedCompanies.forEach(co => renumberCompany(co));
  saveItems();
  if(movedCount === 1){
    showToast(items[0].name + ' → ' + newCompany + ' માં ખસેડ્યું');
  } else if(movedCount > 1){
    showToast(movedCount + ' items → ' + newCompany + ' માં ખસેડ્યા');
  }
  closeMoveSheet();
  if(selectMode){
    selectMode = false;
    selectedIdx.clear();
    el('selectModeBtn').classList.remove('active-select');
    el('addFab').style.display = 'flex';
    renderSelectBar();
  }
  renderChips();
  updateCompanyDatalist();
  renderResults();
}

function toggleSelectMode(){
  selectMode = !selectMode;
  if(!selectMode) selectedIdx.clear();
  el('selectModeBtn').classList.toggle('active-select', selectMode);
  el('addFab').style.display = selectMode ? 'none' : 'flex';
  renderResults();
  renderSelectBar();
}

function toggleSelect(idx){
  if(selectedIdx.has(idx)) selectedIdx.delete(idx); else selectedIdx.add(idx);
  renderResults();
  renderSelectBar();
}

function renderSelectBar(){
  const bar = el('selectBar');
  if(!selectMode){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  el('selectCount').textContent = selectedIdx.size + ' પસંદ કર્યા';
  const filtered = getFiltered();
  const filteredIdxs = filtered.map(item => ITEMS.indexOf(item)).filter(i => i !== -1);
  el('selectAllCheckbox').checked = filteredIdxs.length > 0 && filteredIdxs.every(i => selectedIdx.has(i));
}

function deleteSelected(){
  if(selectedIdx.size === 0) return;
  const count = selectedIdx.size;
  customConfirm(count + ' item ડિલીટ કરવા છે?\nઆ પાછું નહીં આવે.').then(ok => {
    if(!ok) return;
    Array.from(selectedIdx).sort((a, b) => b - a).forEach(i => ITEMS.splice(i, 1));
    saveItems();
    selectMode = false;
    selectedIdx.clear();
    el('selectModeBtn').classList.remove('active-select');
    el('addFab').style.display = 'flex';
    renderChips();
    updateCompanyDatalist();
    renderResults();
    renderSelectBar();
    showToast(count + ' item ડિલીટ થયા');
  });
}

function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function handleSave(){
  const name = el('fName').value.trim();
  if(!name){
    showToast('Item Name લખવું જરૂરી છે');
    el('fName').focus();
    return;
  }
  const company = el('fCompany').value.trim() || 'MISC';
  const label = el('fLabel').value.trim();
  const priceVal = el('fPrice').value.trim();
  const qtyVal = el('fQty').value.trim();

  if(editingIndex === null){
    const maxSr = ITEMS.reduce((m,i) => Math.max(m, Number(i.sr)||0), 0);
    ITEMS.push({
      sr: maxSr + 1,
      company, label, name,
      price: priceVal === '' ? '' : Number(priceVal),
      qty: qtyVal === '' ? '' : Number(qtyVal)
    });
    showToast('વસ્તુ ઉમેરાઈ');
  } else {
    const item = ITEMS[editingIndex];
    item.company = company;
    item.label = label;
    item.name = name;
    item.price = priceVal === '' ? '' : Number(priceVal);
    item.qty = qtyVal === '' ? '' : Number(qtyVal);
    showToast('વસ્તુ update થઈ');
  }
  saveItems();
  closeSheet();
  renderChips();
  renderResults();
}

function handleDelete(){
  if(editingIndex === null) return;
  ITEMS.splice(editingIndex, 1);
  saveItems();
  showToast('વસ્તુ delete થઈ');
  closeSheet();
  renderChips();
  renderResults();
}

(function(){
  const btn = el('fontToggleBtn');
  btn.style.fontWeight = '700';
  function apply(mode){
    if(mode === 'large'){
      document.body.classList.add('font-large');
      btn.classList.add('active-select');
      btn.style.fontSize = '13px';
      btn.textContent = 'Aa−';
      btn.title = 'નાનું font કરો';
    } else {
      document.body.classList.remove('font-large');
      btn.classList.remove('active-select');
      btn.style.fontSize = '13px';
      btn.textContent = 'Aa+';
      btn.title = 'મોટું font કરો';
    }
  }
  let saved = 'small';
  try{ saved = localStorage.getItem('officeAppFontSize') || 'small'; }catch(e){}
  apply(saved);
  btn.addEventListener('click', () => {
    const current = document.body.classList.contains('font-large') ? 'large' : 'small';

  });
})();

function renderAnalysis(){
  const q = (el('analysisSearch').value || '').trim().toLowerCase();
  const byCompany = {};
  ITEMS.forEach(it => {
    const price = Number(it.price) || 0;
    const qty = Number(it.qty) || 0;
    const co = it.company || 'MISC';
    if(!byCompany[co]) byCompany[co] = { qty: 0, value: 0, items: 0 };
    byCompany[co].qty += qty;
    byCompany[co].value += (price * qty);
    if(qty > 0) byCompany[co].items += 1;
  });
  let rows = Object.keys(byCompany).map(co => ({ company: co, ...byCompany[co] }));
  if(q) rows = rows.filter(r => r.company.toLowerCase().includes(q));
  rows.sort((a,b) => b.value - a.value);

  const grandQty = rows.reduce((s,r) => s + r.qty, 0);
  const grandValue = rows.reduce((s,r) => s + r.value, 0);
  el('analysisGrandTotal').innerHTML = `કુલ Stock Value: ₹${grandValue.toLocaleString('en-IN', {maximumFractionDigits:2})} <span style="opacity:.7; font-weight:500;">(Total Qty: ${grandQty})</span>`;

  const wrap = el('analysisRows');
  if(rows.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="stamp-icon">કંઈ મળ્યું નહીં</div></div>`;
    return;
  }
  wrap.innerHTML = rows.map(r => `
    <div class="analysis-row">
      <div class="a-info">
        <div class="a-name">${escapeHtml(r.company)}</div>
        <div class="a-sub">Qty: ${r.qty} · ${r.items} items માં stock</div>
      </div>
      <div class="a-value">₹${r.value.toLocaleString('en-IN', {maximumFractionDigits:2})}</div>
    </div>
  `).join('');
}

/* CUSTOM CONFIRM (styled warning popup, replaces browser confirm) */
function customConfirm(message){
  return new Promise((resolve) => {
    el('customConfirmMsg').textContent = message;
    el('customConfirmOverlay').classList.add('show');
    function cleanup(result){
      el('customConfirmOverlay').classList.remove('show');
      el('customConfirmOk').removeEventListener('click', onOk);
      el('customConfirmCancel').removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    el('customConfirmOk').addEventListener('click', onOk);
    el('customConfirmCancel').addEventListener('click', onCancel);
  });
}

/* SHEET EDIT (Excel-like inline bulk edit for the active company) */
let sheetWorking = []; // working copy of rows currently in the sheet editor
let sheetActiveRow = null; // row index selected via tapping its SR number, used for "+ Row ઉમેરો" position and delete

function openSheetEdit(){
  if(!activeCompanyFilter){
    showToast('પહેલા ઉપર company chip પસંદ કરો');
    return;
  }
  sheetWorking = ITEMS.filter(i => i.company === activeCompanyFilter).map(i => ({ ...i }));
  sheetActiveRow = null;
  el('sheetEditTitleText').textContent = 'Sheet Edit — ' + activeCompanyFilter;
  renderSheetTable();
  el('sheetOverlay').classList.add('show');
}

function closeSheetEdit(){
  el('sheetOverlay').classList.remove('show');
  sheetWorking = [];
  sheetActiveRow = null;
}

function renderSheetTable(){
  const tbody = el('sheetTableBody');
  if(sheetWorking.length === 0){
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--ink-soft);">કોઈ item નથી — નીચે "+ Row ઉમેરો" દબાવો</td></tr>`;
    return;
  }
  tbody.innerHTML = sheetWorking.map((item, i) => `
    <tr data-row="${i}">
      <td class="xl-sr">${i + 1}</td>
      <td class="xl-name">
        <input type="text" data-field="name" data-row="${i}" value="${escapeHtml(item.name || '')}" style="${item.label ? 'padding-bottom:2px;' : ''}">
        ${item.label ? '<div style="font-size:11px; color:#4a4536; line-height:1; margin:-1px 0 3px 6px;">' + escapeHtml(item.label) + '</div>' : ''}
      </td>
      <td class="xl-price"><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-field="price" data-row="${i}" value="${item.price === '' || item.price === undefined ? '' : item.price}"></td>
      <td class="xl-qty"><input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" data-field="qty" data-row="${i}" value="${item.qty === '' || item.qty === undefined ? '' : item.qty}"></td>
    </tr>
  `).join('');

  tbody.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const row = parseInt(inp.dataset.row);
      const field = inp.dataset.field;
      if(!sheetWorking[row]) return;
      if(field === 'price' || field === 'qty'){
        let raw = inp.value.replace(/[^0-9.]/g, '');
        const firstDot = raw.indexOf('.');
        if(firstDot !== -1) raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
        if(raw !== inp.value) inp.value = raw;
        let num = raw === '' || raw === '.' ? '' : Number(raw);
        if(num !== '' && !isNaN(num) && num > 99999){
          num = 99999;
          inp.value = '99999';
        }
        sheetWorking[row][field] = num;
      } else {
        sheetWorking[row][field] = inp.value;
      }
    });
  });

  highlightSheetActiveRow();
}

const SHEET_FIELDS = ['name', 'price', 'qty'];
function focusSheetCell(row, field){
  if(row < 0 || row >= sheetWorking.length) return;
  const inp = el('sheetTableBody').querySelector(`input[data-row="${row}"][data-field="${field}"]`);
  if(inp){ inp.focus(); }
}

function highlightSheetActiveRow(){
  const tbody = el('sheetTableBody');
  tbody.querySelectorAll('tr.xl-active-row').forEach(tr => tr.classList.remove('xl-active-row'));
  if(sheetActiveRow !== null){
    const tr = tbody.querySelector(`tr[data-row="${sheetActiveRow}"]`);
    if(tr) tr.classList.add('xl-active-row');
  }
}

function addSheetRow(){
  const blank = { sr: 0, company: activeCompanyFilter, label: '', name: '', price: '', qty: '' };
  let insertAt;
  if(sheetActiveRow !== null && sheetActiveRow >= 0 && sheetActiveRow < sheetWorking.length){
    insertAt = sheetActiveRow;
    sheetWorking.splice(insertAt, 0, blank);
  } else {
    insertAt = sheetWorking.length;
    sheetWorking.push(blank);
  }
  sheetActiveRow = insertAt;
  renderSheetTable();
  setTimeout(() => {
    focusSheetCell(insertAt, 'name');
    const inp = el('sheetTableBody').querySelector(`input[data-row="${insertAt}"][data-field="name"]`);
    if(inp) inp.scrollIntoView({ block: 'center' });
  }, 30);
}

function deleteSheetActiveRow(){
  if(sheetActiveRow === null || sheetActiveRow < 0 || sheetActiveRow >= sheetWorking.length){
    showToast('પહેલા SR નંબર પર tap કરી row પસંદ કરો');
    return;
  }
  const item = sheetWorking[sheetActiveRow];
  customConfirm((item.name ? item.name : 'આ row') + ' ડિલીટ કરવી છે?\nઆ પાછું નહીં આવે.').then(ok => {
    if(!ok) return;
    sheetWorking.splice(sheetActiveRow, 1);
    sheetActiveRow = null;
    renderSheetTable();
    showToast('Row કાઢી નાખી');
  });
}

function saveSheetEdit(){
  if(!activeCompanyFilter) return;
  const cleaned = sheetWorking.filter(r => (r.name || '').trim() !== '');
  ITEMS = ITEMS.filter(i => i.company !== activeCompanyFilter);
  cleaned.forEach((r, i) => {
    ITEMS.push({
      sr: i + 1,
      company: activeCompanyFilter,
      label: r.label || '',
      name: r.name,
      price: r.price === '' ? '' : Number(r.price),
      qty: r.qty === '' ? '' : Number(r.qty)
    });
  });
  saveItems();
  showToast('Sheet save થઈ');
  closeSheetEdit();
  renderChips();
  renderResults();
}

/* Excel-style: tap a cell selects its whole value so typing replaces it directly (editing only, no row selection) */
el('sheetTableBody').addEventListener('focusin', (e) => {
  if(e.target.matches('input[data-field]')){
    const inp = e.target;
    setTimeout(() => { try{ inp.select(); }catch(err){} }, 0);

});

/* Tap the SR (row number) cell to select that row — highlights it, without opening it for editing.
   That selection decides where "+ Row ઉમેરો" inserts, and which row "🗑 Row કાઢો" removes.
   Tapping the same SR again de-selects it. */
el('sheetTableBody').addEventListener('click', (e) => {
  const td = e.target.closest('td.xl-sr');
  if(!td) return;
  const tr = td.closest('tr[data-row]');
  if(!tr) return;
  const row = parseInt(tr.dataset.row);
  sheetActiveRow = (sheetActiveRow === row) ? null : row;
  highlightSheetActiveRow();
});

/* Enter key: commit this cell and jump straight to the same field on the next row (e.g. Qty -> next Qty).
   Handled on both keydown and keyup since some Android keyboards only fire one of the two for the
   "Next/Go" action key on text inputs. The forced re-focus after a tick guards against the keyboard's
   own "next" action trying to jump to whatever the next field in the page is. */
function handleSheetEnterKey(e){
  const t = e.target;
  if(!t.matches('input[data-field]')) return;
  if(e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    e.stopPropagation();
    const row = parseInt(t.dataset.row);
    const field = t.dataset.field;
    focusSheetCell(row + 1, field);
    setTimeout(() => { focusSheetCell(row + 1, field); }, 0);
  }
}
el('sheetTableBody').addEventListener('keydown', handleSheetEnterKey);
el('sheetTableBody').addEventListener('keyup', handleSheetEnterKey);
